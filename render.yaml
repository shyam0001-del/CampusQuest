services:
  # ----------------------------------------------------------------------------
  # Backend API Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: campusquest-backend
    env: node
    plan: starter
    region: oregon
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /health
    disk:
      name: campusquest-uploads
      mountPath: /var/data/uploads
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TRUST_PROXY
        value: "1"
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false

  # ----------------------------------------------------------------------------
  # Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: campusquest-frontend
    env: static
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
